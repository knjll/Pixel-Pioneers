<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abana Jones- Sample Gallery</title>
    <link rel="stylesheet" href="StyleSheets\style1.css">
    <style>
        * {
          box-sizing: border-box;
        }
        
        body {
          margin: 0;
          font-family: Arial, Helvetica, sans-serif;
        }
        
        .header {
          text-align: center;
          padding: 32px;
        }
        
        .row {
         display: -ms-flexbox; 
         display: flex;
         -ms-flex-wrap: wrap; 
         flex-wrap: wrap;
         padding: 0 4px;
        }
        
        .column {
         -ms-flex: 50%; 
         flex: 50%;
         padding: 0 4px;
        }
        
        .column img {
          margin-top: 12px;
          vertical-align: middle;
        }

        .btn {
          border: none;
         outline: none;
         padding: 10px 16px;
         background-color: #f1f1f1;
         cursor: pointer;
         font-size: 18px;
        }

        .btn:hover {
         background-color: #ddd;
        }

        .btn.active {
         background-color: #666;
         color: white;
        }

        .row:after {
          content: "";
          display: table;
          clear: both;
        }
        </style>
</head>
<body>

    <div class="navbar">
        <a href="homepage.html">Home</a>
        <a href="Photographer Profile.html">Photographer Profile</a>
        <a href="about.html">About Us</a>
        <input type="text" style="font-style: italic;" placeholder="Search..">
    </div> 
    
    <div class="main"> 

      <div class="header" id="myHeader" >
        <h1>Antonio Raimond- Sample Gallery</h1>
        <p>Click on the buttons to change the grid view.</p>
        <button class="btn" onclick="one()">1 </button>
        <button class="btn" onclick="two()">2 </button>
        <button class="btn" onclick="four()">4 </button>
     </div>

     <div class="row" >

        <div class="column">
          <img src="Assets/antonio raimond/1.jpg" style="width:100%">
          <img src="Assets/antonio raimond/2.jpg" style="width:100%">
          <img src="Assets/antonio raimond/3.jpg" style="width:100%">
          <img src="Assets/antonio raimond/4.jpg" style="width:100%">
      </div>
        
        <div class="column">
          <img src="Assets/antonio raimond/5.jpg" style="width:100%">
          <img src="Assets/antonio raimond/6.jpg" style="width:100%">
          <img src="Assets/antonio raimond/7.jpg" style="width:100%">
          <img src="Assets/antonio raimond/8.jpg" style="width:100%">
      </div>

        <div class="column">
          <img src="Assets/antonio raimond/9.jpg" style="width:100%">
          <img src="Assets/antonio raimond/10.jpg" style="width:100%">
          <img src="Assets/antonio raimond/11.jpg" style="width:100%">
          <img src="Assets/antonio raimond/12.jpg" style="width:100%">
      </div>
        
        <div class="column">
            <img src="Assets/antonio raimond/13.jpg" style="width:100%">
            <img src="Assets/antonio raimond/14.jpg" style="width:100%">
            <img src="Assets/antonio raimond/15.jpg" style="width:100%">
            <img src="Assets/antonio raimond/16.jpg" style="width:100%">
        </div>
        
     </div>
    </div>

     <script>

        var elements = document.getElementsByClassName("column");
        
        var i;
        
        function one() {
            for (i = 0; i < elements.length; i++) {
            elements[i].style.msFlex = "100%";  
            elements[i].style.flex = "100%";
          }
        }
        
        function two() {
          for (i = 0; i < elements.length; i++) {
            elements[i].style.msFlex = "50%";  
            elements[i].style.flex = "50%";
          }
        }
        
        function four() {
          for (i = 0; i < elements.length; i++) {
            elements[i].style.msFlex = "25%";  
            elements[i].style.flex = "25%";
          }
        }
        
        var header = document.getElementById("myHeader");
        var btns = header.getElementsByClassName("btn");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function() {
            var current = document.getElementsByClassName("active");
            current[0].className = current[0].className.replace(" active", "");
            this.className += " active";
          });
        }
        </script>
             
</body>
</html>
